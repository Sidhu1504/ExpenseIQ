events { worker_connections 1024; }

http {
    server {
        listen 80;
        
        # 1. Backend API Routing
        location /api/ {
            proxy_pass http://expense_backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 2. Next.js Javascript Hydration Tunnel (Fixes the Dead Buttons!)
        location /_next/webpack-hmr {
            proxy_pass http://expense_frontend:3000/_next/webpack-hmr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # 3. Standard Frontend Page Routing
        location / {
            proxy_pass http://expense_frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
