# ============================================================
# ExpenseIQ — ConfigMap
# Non-sensitive runtime configuration + DB init schema.
#
# NEXT_PUBLIC_API_URL note:
#   Next.js bakes NEXT_PUBLIC_* vars into the JS bundle at
#   BUILD time, not at pod startup.  Setting it here only
#   works for SSR (server-side). For the browser bundle you
#   must pass it as a Docker build-arg when building the
#   frontend image:
#     docker build --build-arg NEXT_PUBLIC_API_URL=/api \
#                  -t expenseiq-frontend:latest ./frontend
#   With the Ingress below, /api proxies to the backend so
#   the relative path /api works from any domain.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: expenseiq-config
  namespace: expenseiq
  labels:
    app.kubernetes.io/part-of: expenseiq
data:
  # ── Backend ──────────────────────────────────────────────
  NODE_ENV: "production"
  PORT: "3000"
  JWT_EXPIRES_IN: "7d"

  # ── Frontend ─────────────────────────────────────────────
  # Relative path — works via Ingress routing regardless of domain.
  # Only effective for SSR; browser bundle needs a build-arg (see above).
  NEXT_PUBLIC_API_URL: "/api"

  # ── DB init schema ───────────────────────────────────────
  # Mounted into /docker-entrypoint-initdb.d/ on the Postgres pod.
  # Postgres runs this ONLY on first initialisation (empty data dir).
  schema.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    DROP SCHEMA public CASCADE;
    CREATE SCHEMA public;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE users (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(255) NOT NULL,
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        role VARCHAR(50) DEFAULT 'user',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE wallets (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(255) NOT NULL,
        owner_id UUID REFERENCES users(id) ON DELETE CASCADE,
        balance DECIMAL(15, 2) DEFAULT 0.00,
        is_shared BOOLEAN DEFAULT FALSE,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE wallet_members (
        wallet_id UUID REFERENCES wallets(id) ON DELETE CASCADE,
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        permissions VARCHAR(50) DEFAULT 'editor',
        PRIMARY KEY (wallet_id, user_id)
    );

    CREATE TABLE categories (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        name VARCHAR(100) NOT NULL,
        type VARCHAR(20) NOT NULL
    );

    CREATE TABLE transactions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        wallet_id UUID REFERENCES wallets(id) ON DELETE CASCADE,
        user_id UUID REFERENCES users(id),
        category_id UUID REFERENCES categories(id) ON DELETE SET NULL,
        amount DECIMAL(15, 2) NOT NULL,
        type VARCHAR(20) NOT NULL,
        merchant_name VARCHAR(255),
        date TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        notes TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE budgets (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        wallet_id UUID REFERENCES wallets(id) ON DELETE CASCADE,
        category_id UUID REFERENCES categories(id) ON DELETE CASCADE,
        limit_amount DECIMAL(15, 2) NOT NULL,
        alert_threshold_percent INTEGER DEFAULT 80,
        month_year DATE NOT NULL DEFAULT CURRENT_DATE
    );

    CREATE TABLE audit_logs (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        action VARCHAR(255) NOT NULL,
        ip_address VARCHAR(45),
        device TEXT,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE subscriptions (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        name VARCHAR(255) NOT NULL,
        amount DECIMAL(10, 2) NOT NULL,
        cycle VARCHAR(50) NOT NULL,
        next_date DATE NOT NULL,
        status VARCHAR(50) DEFAULT 'active'
    );

    CREATE TABLE goals (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        name VARCHAR(255) NOT NULL,
        target_amount DECIMAL(10, 2) NOT NULL,
        current_amount DECIMAL(10, 2) DEFAULT 0,
        deadline DATE
    );

    CREATE TABLE splits (
        id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id UUID REFERENCES users(id) ON DELETE CASCADE,
        friend_name VARCHAR(255) NOT NULL,
        description VARCHAR(255) NOT NULL,
        total_amount DECIMAL(10, 2) NOT NULL,
        amount_owed DECIMAL(10, 2) NOT NULL,
        status VARCHAR(50) DEFAULT 'pending',
        date DATE DEFAULT CURRENT_DATE
    );
