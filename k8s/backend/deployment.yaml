apiVersion: apps/v1
kind: Deployment
metadata:
  name: expenseiq-backend
  namespace: expenseiq
  labels:
    app: expenseiq-backend
    app.kubernetes.io/part-of: expenseiq
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expenseiq-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploys

  template:
    metadata:
      labels:
        app: expenseiq-backend
    spec:
      # Wait for DB to be reachable before starting pods.
      # Requires the postgres ClusterIP service to exist first.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z expenseiq-postgres-clusterip 5432; do
                echo "Waiting for Postgres..."; sleep 3;
              done
              echo "Postgres is ready."

      containers:
        - name: api
          # Build this image from ./backend with a production CMD:
          #   docker build -t expenseiq-backend:latest ./backend
          # The Dockerfile currently uses nodemon (dev). For production,
          # override CMD here or add a production stage to the Dockerfile.
          image: expenseiq-backend:latest
          imagePullPolicy: IfNotPresent

          # Override the Dockerfile's nodemon command with node for production
          command: ["node", "server.js"]

          ports:
            - containerPort: 3000
              name: http

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: expenseiq-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: expenseiq-secrets
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: expenseiq-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: expenseiq-config
                  key: PORT
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: expenseiq-config
                  key: JWT_EXPIRES_IN
            # Tesseract trained data path (same as Dockerfile ENV)
            - name: TESSDATA_PREFIX
              value: /usr/src/app

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # The app exposes /api/health — use it for both probes.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
