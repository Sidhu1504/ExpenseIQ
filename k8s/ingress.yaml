# ============================================================
# ExpenseIQ — Ingress
# Requires the Nginx Ingress Controller to be installed:
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# Replace 'expenseiq.example.com' with your actual domain,
# or remove the host field entirely to match all hostnames.
#
# For TLS, uncomment the tls block and point it at a
# cert-manager Certificate or a manually created TLS Secret.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expenseiq-ingress
  namespace: expenseiq
  labels:
    app.kubernetes.io/part-of: expenseiq
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    # WebSocket support — needed for Next.js HMR and any WS routes
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

    # Strip /api prefix before forwarding to backend
    # e.g. /api/auth/login  →  backend receives /api/auth/login (no strip needed
    # because your Express routes are all under /api already)
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  # ── TLS (uncomment when you have a certificate) ──────────
  # tls:
  #   - hosts:
  #       - expenseiq.example.com
  #     secretName: expenseiq-tls          # kubectl create secret tls ...

  rules:
    - host: expenseiq.example.com          # ← replace with your domain
      http:
        paths:
          # Backend — all /api/* requests
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: expenseiq-backend-service
                port:
                  number: 3000

          # Frontend — everything else
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expenseiq-frontend-service
                port:
                  number: 3000
